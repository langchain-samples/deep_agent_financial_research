[project]
name = "finance-research-agent"
version = "0.1.0"
description = "A comprehensive financial services deep research agent using LangChain DeepAgents and LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deepagents>=0.7.32",
    "langchain>=1.4.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.7.0",
    "langgraph>=1.2.0",
    "langchain-mcp-adapters>=0.3.2",
    "langsmith>=0.14.0",
    "yfinance>=0.2.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "defusedxml>=0.7.1",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
eval = [
    "openevals>=0.2.2",
]
ui = [
    "streamlit>=1.40.0",
    "langgraph-cli[inmem]>=0.4.0",
]
dev = [
    "openevals>=0.2.2",
    "streamlit>=1.40.0",
    "langgraph-cli[inmem]>=0.4.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finance_research_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = "test_*.py"
