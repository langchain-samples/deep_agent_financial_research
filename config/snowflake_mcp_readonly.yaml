# Read-only service config for the Snowflake-Labs MCP server (SNOWFLAKE_MCP_TRANSPORT=stdio).
# Note: snowflake-labs-mcp is deprecated by Snowflake. Prefer a Snowflake-managed MCP server
# (the default streamable_http transport). See README "Snowflake MCP" for setup.
#
# Add your Cortex services below if you have them, for example:
# analyst_services:
#   - service_name: holdings_analyst
#     semantic_model: ANALYTICS.FINANCE.HOLDINGS_SV
#     description: Semantic view over portfolio holdings and positions
agent_services: []
search_services: []
analyst_services: []
other_services:
  object_manager: False
  query_manager: True
  semantic_manager: True
sql_statement_permissions:
  - Select: True
  - Describe: True
  - Use: True
  - Command: False
  - Alter: False
  - Comment: False
  - Commit: False
  - Copy: False
  - Create: False
  - Delete: False
  - Drop: False
  - Insert: False
  - Merge: False
  - Rollback: False
  - Transaction: False
  - TruncateTable: False
  - Update: False
  - Unknown: False
